[project]
name = "nuscenes-sensor-fusion"
version = "1.0.0"
description = "nuScenes 6-camera / lidar / radar fusion: KISS-ICP pose check, EKF multi-object tracking, colored static map, streaming 3D viewer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kiss-icp==1.3.0",
    "numpy>=1.26",
    "open3d==0.19.0",
    "Pillow==11.3.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nuscenes_fusion"]

[tool.setuptools.package-data]
nuscenes_fusion = ["viewer/*.html", "viewer/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
